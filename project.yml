name: SooFrontier
options:
  bundleIdPrefix: com.soofrontier
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  xcodeVersion: "16.0"
settings:
  base:
    DEVELOPMENT_TEAM: 228JYK7A2M
targets:
  SooFrontier:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: SooFrontier
        excludes:
          - Info.plist
          - Resources/Stage
          - Resources/Portraits
      - path: SooFrontier/Resources/Stage
        type: folder
        buildPhase: resources
      - path: SooFrontier/Resources/Portraits
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soofrontier.app
        PRODUCT_NAME: SooFrontier
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: SooFrontier/Info.plist
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "SooFrontier connects to your Mac to use your Claude and ChatGPT subscriptions, and to your local model server."
        INFOPLIST_KEY_CFBundleDisplayName: SooFrontier
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.news
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # Off so the Mac app can run the official claude/codex CLIs on your subscriptions.
        ENABLE_APP_SANDBOX: NO
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ENABLE_USER_SELECTED_FILES: readonly
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        SUPPORTS_MACCATALYST: NO
