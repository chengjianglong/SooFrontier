<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<script type="importmap">{ "imports": { "robust-predicates": "/vendor/robust-predicates/esm/orient2d.js" } }</script>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; -webkit-user-select: none; }
  #stage { position: absolute; inset: 0; display: grid; gap: 10px; padding: 0 12px; }
  .card { position: relative; border-radius: 26px; overflow: hidden; background: #171925; border: 1px solid #2f3447;
    transition: box-shadow .3s, border-color .3s; min-height: 0; }
  .card canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .card.speaking { border-color: rgba(255,126,103,.8); box-shadow: 0 0 0 3px rgba(255,126,103,.35), 0 18px 50px -18px #ff7e67; }
  .name { position: absolute; left: 10px; bottom: 10px; color: #f3f1ee; font: 600 15px -apple-system, sans-serif;
    background: rgba(10,11,18,.62); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); padding: 5px 12px; border-radius: 99px; }
  .dots { position: absolute; top: 12px; right: 12px; display: flex; gap: 5px; opacity: 0; transition: opacity .3s; background: rgba(10,11,18,.6); padding: 8px 10px; border-radius: 99px; }
  .card.thinking .dots { opacity: 1; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: #fff; animation: b 1s infinite; }
  .dots i:nth-child(2) { animation-delay: .15s } .dots i:nth-child(3) { animation-delay: .3s }
  @keyframes b { 0%, 80%, 100% { transform: translateY(0); opacity: .5 } 40% { transform: translateY(-5px); opacity: 1 } }
</style>
</head>
<body>
<div id="stage"></div>
<script type="module" src="stage.js"></script>
</body>
</html>
